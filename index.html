<style>
  :root{--bg:#0f1b2d;--ink:#f4efe6;--muted:#b9b2a6;--gold:#c8a96a;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(ellipse at top,#1b2c47 0%,var(--bg) 65%);color:var(--ink);
       font-family:Inter,system-ui,sans-serif;font-weight:300;display:flex;align-items:center;
       justify-content:center;min-height:100vh;padding:48px 20px;text-align:center}
  main{max-width:640px;width:100%}
  .eyebrow{letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:28px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(44px,9vw,76px);line-height:1;letter-spacing:.02em}
  .rule{width:64px;height:1px;background:var(--gold);margin:32px auto}
  .tag{font-size:17px;color:var(--muted);line-height:1.7}
  .soon{margin-top:14px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:var(--ink)}
  .contact{margin-top:44px;display:flex;flex-direction:column;gap:14px;align-items:center}
  .contact a{color:var(--ink);text-decoration:none;font-size:16px;border:1px solid rgba(200,169,106,.45);
       padding:14px 26px;border-radius:2px;min-width:280px;transition:background .2s,border-color .2s;display:inline-flex;
       align-items:center;justify-content:center;gap:10px}
  .contact a:hover{background:rgba(200,169,106,.12);border-color:var(--gold)}
  .contact svg{width:18px;height:18px;fill:var(--gold);flex:none}
  footer{margin-top:56px;font-size:12px;color:var(--muted);letter-spacing:.06em}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Real Estate</p>
  <h1>Victoria Horlle</h1>
  <div class="rule"></div>

  <p class="soon">Our new website is coming soon.</p>
